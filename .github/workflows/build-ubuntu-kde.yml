name: Build & publish linux-desktop-novnc-pulseaudio-ubuntu-kde

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

concurrency:
  group: build-ubuntu-kde-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: linux-desktop-novnc-pulseaudio-ubuntu-kde
  OS: ubuntu
  DE: kde
  BASE_IMAGE: ubuntu:24.04
  DOCKERFILE: images/ubuntu/kde/Dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub secrets
        id: dockerhub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_PASS: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_PASS" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub (optional)
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          IMG="${IMAGE_NAME}"
          SHA="${{ github.sha }}"
          TAGS="ghcr.io/${OWNER}/${IMG}:${SHA}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS="${TAGS},ghcr.io/${OWNER}/${IMG}:pr-${{ github.event.pull_request.number }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},ghcr.io/${OWNER}/${IMG}:${{ github.ref_name }}"
          else
            TAGS="${TAGS},ghcr.io/${OWNER}/${IMG}:latest"
          fi
          TAGS="${TAGS},ghcr.io/${OWNER}/${IMG}:${OS}-latest"
          if [ "${{ steps.dockerhub.outputs.available }}" = "true" ]; then
            DH="docker.io/marufmoinuddin/${IMG}"
            TAGS="${TAGS},${DH}:${SHA}"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              TAGS="${TAGS},${DH}:pr-${{ github.event.pull_request.number }}"
            elif [ "${{ github.ref_type }}" = "tag" ]; then
              TAGS="${TAGS},${DH}:${{ github.ref_name }}"
            else
              TAGS="${TAGS},${DH}:latest"
            fi
            TAGS="${TAGS},${DH}:${OS}-latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            IMAGE_FLAVOR=${{ env.OS }}-${{ env.DE }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}
          provenance: false

      - name: Smoke test
        uses: ./.github/actions/smoke-test
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}