; supervisord.conf for linux-desktop-novnc-pulseaudio.
; One program per daemon; all logs go to stdout/stderr so `docker logs` shows
; everything (including supervisord's "entered RUNNING state" lines).
;
; The DE session script is selected via %(ENV_DE)s (each image sets ENV DE=...).
[supervisord]
nodaemon=true
logfile=/proc/1/fd/1
logfile_maxbytes=0
logfile_backups=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=/opt/scripts/start-xvfb.sh
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
autostart=true
autorestart=true
startretries=999
startsecs=2
priority=10
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:dbus]
command=/usr/bin/dbus-daemon --nofork --nopidfile --config-file=/usr/share/dbus-1/system.conf
user=root
autostart=true
autorestart=true
startretries=999
startsecs=2
priority=20
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:ui]
command=/opt/scripts/start-%(ENV_DE)s.sh
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
autostart=true
autorestart=true
startretries=999
startsecs=2
priority=40
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:vnc]
command=/opt/scripts/start-vnc.sh
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
autostart=true
autorestart=true
startretries=999
startsecs=2
priority=30
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/opt/scripts/start-novnc.sh
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
autostart=true
autorestart=true
startretries=999
startsecs=2
priority=50
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:audioserver]
command=/opt/scripts/start-audioserver.sh
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
autostart=true
autorestart=true
startretries=999
startsecs=2
priority=60
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/opt/scripts/start-nginx.sh
user=root
autostart=true
autorestart=true
startretries=999
startsecs=2
priority=70
stdout_logfile=/proc/1/fd/1
