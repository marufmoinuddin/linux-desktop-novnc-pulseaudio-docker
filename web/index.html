<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>noVNC — Linux Desktop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1b; color: #eee;
    font-family: system-ui, sans-serif; }
  #vnc-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
<script src="jsmpeg.min.js"></script>
</head>
<body>
<iframe id="vnc-frame"
  src="vnc.html?autoconnect=true&path=websockify&resize=remote&reconnect=true"
  allow="clipboard-read; clipboard-write"></iframe>
<script>
  (function () {
    if (!window.JSMpeg) {
      // jsmpeg failed to load; the desktop still works, only audio is off.
      return;
    }

    // wss when the page itself is https (browsers block mixed-content ws://).
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var audio = new JSMpeg.Player(proto + '//' + location.host + '/audio', {
      video: false,
      audio: true,
      audioBufferSize: 128 * 1024,
      maxAudioLag: 0.25,
      autoplay: true
    });

    // Audio is enabled by default: the player starts immediately, and if the
    // browser suspended the WebAudio context (autoplay policy: Chrome/Edge/
    // Firefox allow sound only after a user gesture), we unlock it silently
    // on the first interaction with the page — no button, no overlay. The
    // user's first click/keypress on the desktop counts as that gesture.
    function unlockAudio() {
      var ctx = audio.audioOut && audio.audioOut.context;
      if (ctx && ctx.resume) {
        ctx.resume().catch(function () {});
      }
      if (audio.audioOut && audio.audioOut.unlock) {
        audio.audioOut.unlock(function () {});
      }
      try { audio.play(); } catch (e) {}
    }
    ['pointerdown', 'keydown', 'touchstart'].forEach(function (evt) {
      document.addEventListener(evt, unlockAudio, { once: true, passive: true });
    });
  })();
</script>
</body>
</html>
