<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>noVNC — Linux Desktop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1b; color: #eee;
    font-family: system-ui, sans-serif; }
  #vnc-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #audio-status { position: fixed; right: 8px; bottom: 8px; z-index: 10;
    font-size: 12px; color: #8f8; background: rgba(0,0,0,.6);
    padding: 2px 8px; border-radius: 4px; }
</style>
<script src="jsmpeg.min.js"></script>
</head>
<body>
<iframe id="vnc-frame"
  src="vnc.html?autoconnect=true&path=websockify&resize=remote&reconnect=true"
  allow="clipboard-read; clipboard-write"></iframe>
<div id="audio-status">audio: connecting…</div>
<script>
  var statusEl = document.getElementById('audio-status');
  var audio = new JSMpeg.Player('ws://' + location.host + '/audio', {
    video: false,
    audio: true,
    audioBufferSize: 128 * 1024,
    maxAudioLag: 0.25,
    autoplay: true,
    onPlay: function () { statusEl.textContent = 'audio: playing'; },
    onStalled: function () { statusEl.textContent = 'audio: stalled'; }
  });
</script>
</body>
</html>
